services:
  - type: web
    name: dialens-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python model.py
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: ALLOWED_ORIGINS
        value: https://YOUR-APP.vercel.app
      - key: ALLOWED_ORIGIN_REGEX
        value: https://.*\.vercel\.app
